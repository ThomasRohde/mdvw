name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Top-level permissions are intentionally minimal. Elevated scopes are
# granted per-job where actually needed.
permissions: {}

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install hatch
      - run: python scripts/fetch_vendor.py --verify
      - run: hatch build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dist
          path: dist/*

  build-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .[dev]
      - run: python scripts/fetch_vendor.py --verify
      - run: pyinstaller packaging/mdvw.spec
      - name: Zip onedir
        shell: pwsh
        run: Compress-Archive -Path dist/mdvw/* -DestinationPath dist/mdvw-win-x64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-exe
          path: dist/mdvw-win-x64.zip

  publish-pypi:
    needs: [build-wheel, build-exe]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      # Protected environment — configure required reviewers + allowed tags
      # in the GitHub UI so unreviewed tags cannot trigger a publish.
      name: pypi
      url: https://pypi.org/p/mdvw
    permissions:
      id-token: write       # OIDC for trusted publishing
      contents: write       # required for action-gh-release asset upload
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: pypi-dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win-exe
          path: release-assets/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: pypi-dist/
          skip-existing: true
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            pypi-dist/*.whl
            pypi-dist/*.tar.gz
            release-assets/mdvw-win-x64.zip
          generate_release_notes: true
